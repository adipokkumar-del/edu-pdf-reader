name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Force compileSdk 36 and skip lint for all plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  if (p.hasProperty('android')) {
                      p.android.compileSdk = 36
                  }
              }
              tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                      t.enabled = false
                  }
              }
          }
          EOF

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name edu_pdf_reader --org com.edu
          rm -f test/widget_test.dart
          cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          MAIN=$(find android/app/src/main -name 'MainActivity.kt' | head -n 1)
          PKG=$(grep -m1 '^package ' "$MAIN")
          DIR=$(dirname "$MAIN")
          cp ci/MainActivity.kt "$MAIN"
          cp ci/Reminders.kt "$DIR/Reminders.kt"
          sed -i "1s/.*/$PKG/" "$MAIN" "$DIR/Reminders.kt"
          mkdir -p android/app/src/main/res/xml
          cp ci/file_paths.xml android/app/src/main/res/xml/file_paths.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: edu-pdf-reader-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
