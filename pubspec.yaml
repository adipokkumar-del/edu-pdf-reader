name: edu_pdf_reader
description: A minimalist education-themed PDF reader with annotation support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PDF rendering, search, text selection
  pdfrx: ^2.4.2
  # Export annotated pages as a new PDF
  pdf: ^3.11.1

  # File access
  path_provider: ^2.1.4
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Local storage (last page, bookmarks, settings)
  shared_preferences: ^2.3.2

  # Share
  share_plus: ^10.0.2

  # State management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
